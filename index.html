<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calc-container">
        <div class="display-panel">
            <div id="display-main" class="display-main">0</div>
        </div>
        <div class="buttons-grid">
            <button onclick="clearDisplay()" class="button span-2" aria-label="Clear">C</button>
            <button onclick="appendInput('/')" class="button operator" aria-label="Divide">/</button>
            <button onclick="appendInput('*')" class="button operator" aria-label="Multiply">*</button>

            <button onclick="appendInput('7')" class="button" aria-label="Seven">7</button>
            <button onclick="appendInput('8')" class="button" aria-label="Eight">8</button>
            <button onclick="appendInput('9')" class="button" aria-label="Nine">9</button>
            <button onclick="appendInput('-')" class="button operator" aria-label="Subtract">-</button>

            <button onclick="appendInput('4')" class="button" aria-label="Four">4</button>
            <button onclick="appendInput('5')" class="button" aria-label="Five">5</button>
            <button onclick="appendInput('6')" class="button" aria-label="Six">6</button>
            <button onclick="appendInput('+')" class="button operator" aria-label="Add">+</button>

            <button onclick="appendInput('1')" class="button" aria-label="One">1</button>
            <button onclick="appendInput('2')" class="button" aria-label="Two">2</button>
            <button onclick="appendInput('3')" class="button" aria-label="Three">3</button>
            <button onclick="calculate()" class="button span-2 equals" aria-label="Equals">=</button>

            <button onclick="appendInput('0')" class="button" aria-label="Zero">0</button>
            <button onclick="appendInput('.')" class="button" aria-label="Decimal Point">.</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
