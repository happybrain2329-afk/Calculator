<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator-container">
        <section class="display">
            <input type="text" id="display-history" class="display-history" readonly>
            <input type="text" id="display-main" class="display-main" value="0" readonly>
        </section>
        <section class="buttons-grid">
            <button id="clear" onclick="clearDisplay()">C</button>
            <button id="delete" onclick="deleteLastChar()">DEL</button>
            <button id="percentage" onclick="appendInput('%')">%</button>
            <button id="divide" onclick="appendInput('/')">/</button>

            <button onclick="appendInput('7')">7</button>
            <button onclick="appendInput('8')">8</button>
            <button onclick="appendInput('9')">9</button>
            <button id="multiply" onclick="appendInput('*')">*</button>

            <button onclick="appendInput('4')">4</button>
            <button onclick="appendInput('5')">5</button>
            <button onclick="appendInput('6')">6</button>
            <button id="subtract" onclick="appendInput('-')">-</button>

            <button onclick="appendInput('1')">1</button>
            <button onclick="appendInput('2')">2</button>
            <button onclick="appendInput('3')">3</button>
            <button id="add" onclick="appendInput('+')">+</button>

            <button id="sign-change" onclick="toggleSign()">+/-</button>
            <button onclick="appendInput('0')">0</button>
            <button onclick="appendInput('.')">.</button>
            <button id="equals" onclick="calculate()">=</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
